name: Cursor Watch — daily refresh

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC ≈ 7:00am ET, every day
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: cursor-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run pipeline (Firecrawl scrape + search)
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          DASHBOARD_URL: "https://eferrao.github.io/cursor-watch/"
        run: python update.py

      - name: Commit refreshed dashboard + digest
        run: |
          git config user.name  "cursor-watch-bot"
          git config user.email "actions@github.com"
          git add docs digests latest-digest.md
          git commit -m "Daily refresh: $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
